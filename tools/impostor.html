<!doctype html>
<html><body style="margin:0;background:transparent">
<canvas id="c" width="1024" height="1024"></canvas>
<script type="module">
// Outil de fabrication : photographie un arbre 3D sous plusieurs angles (fond transparent) pour en faire des imposteurs.
import * as THREE from './vendor/three.module.js';
import { GLTFLoader } from './vendor/GLTFLoader.js';
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), alpha: true, antialias: true, preserveDrawingBuffer: true });
r.setClearColor(0x000000, 0); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight('#dfefff', '#4a5a30', 1.6));
const sun = new THREE.DirectionalLight('#fff1dc', 3.2); sun.position.set(-8, 14, 10); scene.add(sun);
const gltf = await new GLTFLoader().loadAsync(new URLSearchParams(location.search).get('m'));
const tree = gltf.scene; scene.add(tree);
tree.traverse((o) => { if (o.material) { o.material.alphaTest = 0.45; o.material.transparent = false; o.material.side = THREE.DoubleSide; } });
const box = new THREE.Box3().setFromObject(tree), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
const half = Math.max(size.x, size.z, size.y) / 2 * 1.02;
const cam = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 200);
window.shots = [];
for (const yaw of [0, Math.PI / 2]) {
  cam.position.set(c.x + Math.sin(yaw) * 60, c.y, c.z + Math.cos(yaw) * 60); cam.lookAt(c.x, c.y, c.z);
  sun.position.set(c.x + Math.sin(yaw - 0.8) * 20, c.y + 18, c.z + Math.cos(yaw - 0.8) * 20);
  r.render(scene, cam);
  window.shots.push(r.domElement.toDataURL('image/png'));
}
window.info = { w: size.x, h: size.y, d: size.z, half, cy: c.y, minY: box.min.y };
window.done = true;
</script>
</body></html>
