name: Version web (GitHub Pages)

on:
  push:
    branches: [ccr-11bf06a5-xlp09d]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assembler le site (arène + Guerre Éclair)
        run: |
          mkdir _site
          cp -r www/. _site/
          mkdir _site/eclair && cp -r eclair/. _site/eclair/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
