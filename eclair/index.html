<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1f12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Guerre Éclair</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/eclair.css">
</head>
<body class="eclair">
<div class="intro3d" id="intro"></div>

<!-- Menu -->
<section class="screen" id="scr-menu">
  <div class="ec-home">
    <div class="ec-play">
      <div class="ec-hero">
        <canvas id="heroArt" width="220" height="220"></canvas>
        <div>
          <h1 class="ec-title">GUERRE<br><span>ÉCLAIR</span></h1>
          <p class="muted small">48 figurines · drapeau · plan secret</p>
          <p class="ec-stats" id="stats"></p>
        </div>
      </div>

      <div class="mode-card">
        <label class="field"><span>Ton nom</span><input id="myName" maxlength="16" autocomplete="off" placeholder="Joueur"></label>
        <h3>Placement des figurines</h3>
        <div class="seg" id="placeSeg"><button data-v="auto">🎲 Automatique</button><button data-v="manuel">✋ À la main</button></div>
      </div>

      <button class="ec-big" id="btnVsAI"><span>🤖</span><b>Contre l'ordi</b><small>Une partie seul contre l'ordinateur</small></button>

      <div class="ec-card2">
        <div class="ec-big-head"><span>👥</span><b>À deux</b><small>Sur le même écran, chacun son tour</small></div>
        <div class="join-row"><input id="p2Name" maxlength="16" autocomplete="off" placeholder="Nom du joueur 2"><button class="btn primary" id="btnDuo">Jouer</button></div>
      </div>

      <div class="ec-card2">
        <div class="ec-big-head"><span>🌐</span><b>En ligne</b><small>Chacun sur son appareil, avec un code</small></div>
        <button class="btn primary" id="btnHost">Créer une partie</button>
        <div class="join-row"><input id="joinCode" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn ghost" id="btnJoin">Rejoindre</button></div>
      </div>

      <div class="ec-foot">
        <label class="toggle"><span>🔊 Sons</span><input type="checkbox" id="setSound" checked><i></i></label>
        <button class="btn ghost" id="btnIntro">🎬 Revoir l'intro</button>
      </div>
    </div>

    <aside class="ec-guide">
      <h2 class="gd-head">📖 Règles du jeu</h2>
      <div id="guide"><p class="muted">Chargement des figurines…</p></div>
    </aside>
  </div>
</section>

<!-- Partie -->
<section class="screen game" id="scr-arena">
  <canvas id="arena"></canvas>
  <div class="ec-side left">
    <div class="ec-btns">
      <button class="icon-btn glass" id="btnPause" aria-label="Pause">❚❚</button>
      <button class="icon-btn glass help-ingame" id="btnHelp" aria-label="Règles du jeu">?</button>
      <button class="icon-btn glass" id="btnView" aria-label="Recentrer la vue">🎥</button>
    </div>
    <div class="ec-score" id="score0"></div>
  </div>
  <div class="ec-side right">
    <div class="chip glass" id="arenaChip"></div>
    <div class="ec-score" id="score1"></div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="arena-controls" id="arenaControls"></div>
</section>

<div class="modal" id="mdPause">
  <div class="card">
    <h2>Pause</h2>
    <button class="btn primary" id="btnResume">Reprendre</button>
    <button class="btn ghost" id="btnHelpPause">❓ Règles du jeu</button>
    <button class="btn ghost" id="btnRestart">Recommencer</button>
    <button class="btn ghost" id="btnQuit">Quitter</button>
  </div>
</div>

<div class="modal" id="mdResult">
  <div class="card">
    <h2 id="resTitle"></h2>
    <p id="resText" class="muted"></p>
    <button class="btn primary" id="btnRetry">Rejouer</button>
    <button class="btn ghost" id="btnMenu">Menu</button>
  </div>
</div>

<div class="modal" id="mdRules">
  <div class="card ec-rules-card">
    <div class="ec-rules-top"><h2>📖 Règles du jeu</h2><button class="icon-btn" id="btnRulesClose" aria-label="Fermer">✕</button></div>
    <div class="ec-guide in-modal" id="guide2"></div>
  </div>
</div>

<div class="modal" id="mdOnline">
  <div class="card">
    <h2 id="onTitle">En ligne</h2>
    <div class="online-code" id="onCode">…</div>
    <p id="onText" class="muted"></p>
    <button class="btn ghost" id="onCancel">Annuler</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
